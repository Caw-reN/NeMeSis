version: "3.9"

services:
  # ============================================================
  # SERVICE: FRONTEND (React + Vite → Nginx)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: nms_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - nginx
    networks:
      - nms_network

  # ============================================================
  # SERVICE: NGINX (Web Server / Reverse Proxy for Backend)
  # ============================================================
  nginx:
    image: nginx:stable-alpine
    container_name: nms_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - nms_network

  # ============================================================
  # SERVICE: BACKEND (PHP-FPM / Laravel 11)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: nms_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=mysql
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-nms_db}
      - DB_USERNAME=${DB_USERNAME:-nms_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - nms_network

  # ============================================================
  # SERVICE: WORKER (Go — Network Scanning Engine)
  # Runs as a background daemon — no HTTP port exposed.
  # Requires NET_RAW capability for ICMP ping (go-ping library).
  # ============================================================
  worker:
    build:
      context: ./worker
      dockerfile: ../docker/worker/Dockerfile
    container_name: nms_worker
    restart: unless-stopped
    environment:
      - DB_HOST=database
      - DB_PORT=3306
      - DB_NAME=${DB_DATABASE:-nms_db}
      - DB_USER=${DB_USERNAME:-nms_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-60}
      - WORKER_POOL_SIZE=${WORKER_POOL_SIZE:-50}
    cap_add:
      - NET_RAW  # Required for privileged ICMP ping
    depends_on:
      database:
        condition: service_healthy
    networks:
      - nms_network

  # ============================================================
  # SERVICE: DATABASE (MySQL 8.0)
  # ============================================================
  database:
    image: mysql:8.0
    container_name: nms_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nms_db}
      MYSQL_USER: ${DB_USERNAME:-nms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "3306:3306"
    volumes:
      - nms_mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nms_network

# ============================================================
# NETWORKS
# ============================================================
networks:
  nms_network:
    driver: bridge

# ============================================================
# VOLUMES (Named Volumes for Data Persistence)
# ============================================================
volumes:
  nms_mysql_data:
    driver: local

